name: Flutter Mobile CI

on:
  push:
    branches:
      - feature/mobile-multishop-ordering
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

jobs:
  flutter-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve shared package
        working-directory: mobile/packages/lpg_mobile_core
        run: flutter pub get
      - name: Analyze shared package
        working-directory: mobile/packages/lpg_mobile_core
        run: flutter analyze
      - name: Test shared package
        working-directory: mobile/packages/lpg_mobile_core
        run: flutter test
      - name: Resolve customer app
        working-directory: mobile/apps/customer_app
        run: flutter pub get
      - name: Analyze customer app
        working-directory: mobile/apps/customer_app
        run: flutter analyze
      - name: Resolve business/staff app
        working-directory: mobile/apps/business_staff_app
        run: flutter pub get
      - name: Analyze business/staff app
        working-directory: mobile/apps/business_staff_app
        run: flutter analyze
